<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffe9d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>나만의 야생동물</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div id="title"></div>
      <div id="coins"><span class="coin-icon">🪙</span><span id="coin-count">0</span></div>
    </header>

    <main id="room">
      <div id="room-floor"></div>
    </main>

    <div id="nest"></div>

    <nav id="bar">
      <button id="btn-feed" class="big-btn"><span class="icon">🍖</span><span class="label">밥 주기</span></button>
      <button id="btn-walk" class="big-btn"><span class="icon">🌿</span><span class="label">산책</span></button>
      <button id="btn-egg" class="big-btn main"><span class="icon">🥚</span><span class="label" id="egg-label">알 뽑기</span></button>
      <button id="btn-dex" class="big-btn"><span class="icon">📖</span><span class="label">도감</span></button>
    </nav>

    <!-- 알 깨기 화면 -->
    <section id="egg-screen" class="overlay hidden">
      <div id="egg-hint">알을 톡톡 두드려요!</div>
      <div id="egg-wrap">
        <div id="egg"><div id="egg-cracks"></div></div>
      </div>
      <div id="reveal" class="hidden">
        <div id="reveal-burst"></div>
        <div id="reveal-animal"></div>
        <div id="reveal-tier"></div>
        <div id="reveal-name"></div>
        <div id="reveal-note"></div>
        <button id="reveal-ok" class="pill-btn">좋아요!</button>
      </div>
    </section>

    <!-- 도감 화면 -->
    <section id="dex-screen" class="overlay hidden">
      <div class="sheet">
        <div class="sheet-head">
          <h2>도감 <span id="dex-progress"></span></h2>
        </div>
        <div id="dex-grid"></div>
        <button id="dex-close" class="pill-btn">닫기</button>
      </div>
    </section>

    <!-- 산책: 누구랑 갈지 고르기 -->
    <section id="walk-pick" class="overlay hidden">
      <div class="sheet">
        <h2>누구랑 산책할까요?</h2>
        <div id="walk-pick-grid"></div>
        <button id="walk-pick-close" class="pill-btn">닫기</button>
      </div>
    </section>

    <!-- 산책: 야생 들판 -->
    <section id="walk-screen" class="overlay hidden">
      <div class="wl wl-sky"><div id="wl-sun">☀️</div></div>
      <div class="wl wl-far"></div>
      <div class="wl wl-mid"></div>
      <div class="wl wl-ground"></div>
      <div id="walk-world"></div>
      <div id="walk-top">
        <div id="walk-timer"><div id="walk-timer-fill"></div></div>
        <div id="walk-count">🪙 0</div>
      </div>
      <div id="walk-hint">보물을 톡! 친구를 톡 누르면 점프해요</div>
      <div id="walk-result" class="hidden">
        <div class="card">
          <h2>산책 끝!</h2>
          <div id="walk-result-animal"></div>
          <div id="walk-result-items"></div>
          <div id="walk-result-text"></div>
          <button id="walk-home" class="pill-btn">집으로</button>
        </div>
      </div>
    </section>

    <!-- 타이틀 화면: 처음 열면 보이는 화면 -->
    <section id="title-screen" class="overlay">
      <div id="title-sky"></div>
      <h1 id="logo"><span id="logo-small"></span><span id="logo-big"></span></h1>
      <p id="tagline">알을 톡톡 깨서 만나는<br>강아지부터 공룡, 유니콘까지!</p>
      <div id="parade"><div id="parade-track"></div></div>
      <button id="title-egg" aria-label="시작하기"><span class="q">?</span></button>
      <div id="title-cta"></div>
      <div id="title-sub"></div>
    </section>

    <div id="hand-hint" class="hidden">👆</div>
    <div id="toast" class="hidden"></div>
  </div>

  <script src="config.js"></script>
  <script src="art.js"></script>
  <script src="game.js"></script>
</body>
</html>
